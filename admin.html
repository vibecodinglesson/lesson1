
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f7f6;
      color: #24332e;
    }
    section {
      background: white;
      padding: 22px;
      margin: 18px 0;
      border-radius: 12px;
    }
    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
    }
    button {
      cursor: pointer;
      background: #247a55;
      color: white;
      border: 0;
      border-radius: 6px;
    }
    #admin-area { display: none; }
  </style>
</head>
<body>
  <h1>Course Administration</h1>

  <section id="login-area">
    <h2>Admin Login</h2>
    <form id="login-form">
      <input id="email" type="email"
        placeholder="Admin email" required>
      <input id="password" type="password"
        placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>
    <p id="login-status" role="status"></p>
  </section>

  <section id="admin-area">
    <h2>Add a Course</h2>
    <p id="signed-in"></p>

    <form id="course-form">
      <input id="title" type="text"
        placeholder="Course title" required maxlength="100">
      <textarea id="description"
        placeholder="Course description"
        maxlength="500"></textarea>
      <button type="submit">Save Course</button>
    </form>

    <p id="course-status" role="status"></p>
    <button id="logout-button" type="button">Sign Out</button>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ltvsyzuhdlkwrtdqlcif.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IZDrJTf3cCsA_YW3j4LzIA_qysEmcEH";
    const ADMIN_UID = "1708d3e4-0aa3-4a19-bbb2-326da72c09f8";

    const db = supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    const loginArea = document.getElementById("login-area");
    const adminArea = document.getElementById("admin-area");

    async function updateScreen() {
      const { data, error } = await db.auth.getSession();

      if (error) {
        document.getElementById("login-status").textContent =
          "Unable to check login status.";
        return;
      }

      const user = data.session?.user;

      if (user && user.id === ADMIN_UID) {
        loginArea.style.display = "none";
        adminArea.style.display = "block";
        document.getElementById("signed-in").textContent =
          "Signed in as " + user.email;
      } else {
        loginArea.style.display = "block";
        adminArea.style.display = "none";
      }
    }

    document.getElementById("login-form")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        const status = document.getElementById("login-status");
        status.textContent = "Signing in...";

        const { error } = await db.auth.signInWithPassword({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
        });

        if (error) {
          status.textContent = "Sign-in failed. Check your details.";
          return;
        }

        await updateScreen();

        const { data } = await db.auth.getSession();
        if (data.session?.user.id !== ADMIN_UID) {
          await db.auth.signOut();
          status.textContent = "This account is not authorized.";
        }
      });

    document.getElementById("course-form")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        const status = document.getElementById("course-status");
        status.textContent = "Saving...";

        const { data: sessionData } = await db.auth.getSession();
        const user = sessionData.session?.user;

        if (!user || user.id !== ADMIN_UID) {
          status.textContent = "Admin sign-in required.";
          return;
        }

        const title = document.getElementById("title").value.trim();
        const description =
          document.getElementById("description").value.trim();

        if (!title) {
          status.textContent = "Enter a course title.";
          return;
        }

        const { error } = await db
          .from("courses")
          .insert([{ title, description: description || null }]);

        if (error) {
          console.error(error);
          status.textContent =
            "Save failed. Check permissions and try again.";
          return;
        }

        status.textContent = "Course saved successfully!";
        event.target.reset();
      });

    document.getElementById("logout-button")
      .addEventListener("click", async () => {
        await db.auth.signOut();
        document.getElementById("login-status").textContent =
          "You have signed out.";
        await updateScreen();
      });

    db.auth.onAuthStateChange(() => {
      updateScreen();
    });

    updateScreen();
  </script>
</body>
</html>
