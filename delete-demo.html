
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DELETE Practice - Supabase</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f7fb;
    }
    input, select, button {
      box-sizing: border-box;
      display: block;
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }
    button { cursor: pointer; }
    .danger { background: #b42318; color: white; border: none; }
  </style>
</head>
<body>
  <h1>Delete a Course</h1>
  <p>Practice deleting a course from your Supabase database.</p>

  <h2>Admin login</h2>
  <input id="email" type="email" placeholder="Admin email">
  <input id="password" type="password" placeholder="Admin password">
  <button id="loginButton">Sign in</button>
  <button id="logoutButton">Sign out</button>

  <hr>

  <h2>Select a course</h2>
  <button id="loadButton">Load Courses</button>
  <select id="courseSelect">
    <option value="">Select a course</option>
  </select>

  <button id="deleteButton" class="danger">Delete Selected Course</button>
  <p id="status">Please sign in as your authorized admin.</p>

  <script>
    const SUPABASE_URL = "https://ltvsyzuhdlkwrtdqlcif.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IZDrJTf3cCsA_YW3j4LzIA_qysEmcEH";

    let accessToken = null;

    const status = document.getElementById("status");
    const select = document.getElementById("courseSelect");

    async function apiRequest(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${accessToken}`,
          ...options.headers
        }
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.message || "Request failed.");
      }

      if (response.status === 204) return null;
      return response.json();
    }

    document.getElementById("loginButton").onclick = async () => {
      try {
        status.textContent = "Signing in...";

        const response = await fetch(
          `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
          {
            method: "POST",
            headers: {
              "apikey": SUPABASE_KEY,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.msg || data.message || "Login failed.");
        }

        accessToken = data.access_token;
        status.textContent = "Signed in. Load courses to continue.";

      } catch (error) {
        status.textContent = "Error: " + error.message;
      }
    };

    document.getElementById("loadButton").onclick = async () => {
      if (!accessToken) {
        status.textContent = "Please sign in first.";
        return;
      }

      try {
        const courses = await apiRequest(
          `${SUPABASE_URL}/rest/v1/courses?select=id,title&order=id.asc`
        );

        select.replaceChildren(new Option("Select a course", ""));

        courses.forEach(course => {
          select.add(new Option(course.title, course.id));
        });

        status.textContent = `Loaded ${courses.length} courses.`;

      } catch (error) {
        status.textContent = "Error: " + error.message;
      }
    };

    document.getElementById("deleteButton").onclick = async () => {
      if (!accessToken) {
        status.textContent = "Please sign in first.";
        return;
      }

      if (!select.value) {
        status.textContent = "Please select a course.";
        return;
      }

      const courseName = select.selectedOptions[0].textContent;

      if (!confirm(`Permanently delete "${courseName}"?`)) {
        status.textContent = "Deletion cancelled.";
        return;
      }

      try {
        status.textContent = "Deleting course...";

        const deleted = await apiRequest(
          `${SUPABASE_URL}/rest/v1/courses?id=eq.${encodeURIComponent(select.value)}&select=id,title`,
          {
            method: "DELETE",
            headers: {
              "Prefer": "return=representation"
            }
          }
        );

        if (!deleted || deleted.length === 0) {
          throw new Error(
            "No course deleted. Check your DELETE policy and table privileges."
          );
        }

        status.textContent = `Deleted "${deleted[0].title}".`;
        document.getElementById("loadButton").click();

      } catch (error) {
        status.textContent = "Error: " + error.message;
      }
    };

    document.getElementById("logoutButton").onclick = () => {
      accessToken = null;
      status.textContent = "Signed out.";
    };
  </script>
</body>
</html>
