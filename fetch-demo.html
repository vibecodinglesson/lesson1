
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First API Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 750px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f7fb;
    }
    button {
      padding: 10px 18px;
      cursor: pointer;
    }
    .post {
      background: white;
      padding: 15px;
      margin: 12px 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>My First API Project</h1>
  <p>These posts are fetched from an external API.</p>

  <button id="loadButton">Load Posts</button>
  <p id="status">Click the button to begin.</p>
  <div id="posts"></div>

  <script>
    const button = document.getElementById("loadButton");
    const status = document.getElementById("status");
    const postsContainer = document.getElementById("posts");

    async function loadPosts() {
      button.disabled = true;
      status.textContent = "Loading posts...";

      try {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/posts?_limit=5"
        );

        if (!response.ok) {
          throw new Error("The API request failed.");
        }

        const posts = await response.json();
        postsContainer.replaceChildren();

        posts.forEach(post => {
          const card = document.createElement("section");
          card.className = "post";

          const heading = document.createElement("h2");
          heading.textContent = post.title;

          const paragraph = document.createElement("p");
          paragraph.textContent = post.body;

          card.append(heading, paragraph);
          postsContainer.appendChild(card);
        });

        status.textContent = `Loaded ${posts.length} posts successfully.`;

      } catch (error) {
        console.error(error);
        status.textContent =
          "Could not load posts. Please try again.";
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", loadPosts);
  </script>
</body>
</html>
